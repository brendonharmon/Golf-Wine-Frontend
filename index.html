<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wanderlust Travel</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    header {
      background: #1a1a2e;
      color: white;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 { font-size: 1.8rem; letter-spacing: 1px; }
    header p { color: #aaa; font-size: 0.9rem; }

    .hero {
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      color: white;
      text-align: center;
      padding: 80px 20px;
    }

    .hero h2 { font-size: 2.8rem; margin-bottom: 15px; }
    .hero p { font-size: 1.2rem; color: #ccc; max-width: 500px; margin: 0 auto; }

    .trips-section {
      max-width: 1100px;
      margin: 50px auto;
      padding: 0 20px;
    }

    .trips-section h3 {
      font-size: 1.6rem;
      margin-bottom: 30px;
      color: #1a1a2e;
    }

    .trips-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 30px;
    }

    .trip-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .trip-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    }

    .trip-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .trip-card-body { padding: 20px; }

    .trip-card-body h4 {
      font-size: 1.2rem;
      margin-bottom: 8px;
      color: #1a1a2e;
    }

    .trip-meta {
      display: flex;
      gap: 15px;
      margin: 10px 0;
      font-size: 0.9rem;
      color: #666;
    }

    .trip-card-body p {
      font-size: 0.9rem;
      color: #777;
      line-height: 1.5;
      margin-bottom: 15px;
    }

    .btn {
      display: inline-block;
      background: #0f3460;
      color: white;
      padding: 10px 22px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .btn:hover { background: #e94560; }

    .price {
      font-size: 1.3rem;
      font-weight: bold;
      color: #e94560;
      margin-bottom: 10px;
    }

    .loading {
      text-align: center;
      padding: 60px;
      color: #666;
      font-size: 1.1rem;
    }

    footer {
      background: #1a1a2e;
      color: #aaa;
      text-align: center;
      padding: 30px;
      margin-top: 60px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<header>
  <div>
    <h1>✈ Wanderlust Travel</h1>
    <p>Handcrafted journeys for curious explorers</p>
  </div>
</header>

<div class="hero">
  <h2>Find Your Next Adventure</h2>
  <p>Browse our curated preplanned itineraries and book your dream trip today.</p>
</div>

<div class="trips-section">
  <h3>Available Trips</h3>
  <div class="trips-grid" id="tripsGrid">
    <div class="loading">Loading trips...</div>
  </div>
</div>

<footer>
  <p>© 2026 Wanderlust Travel. All rights reserved.</p>
</footer>

<script>
  const API = 'https://golf-wine-website-production.up.railway.app';

  async function loadTrips() {
    try {
      const res = await fetch(`${API}/api/trips`);
      const trips = await res.json();
      const grid = document.getElementById('tripsGrid');
      grid.innerHTML = '';

      trips.forEach(trip => {
        grid.innerHTML += `
          <div class="trip-card" onclick="window.location.href='trip.html?id=${trip.id}'">
            <img src="${trip.imageUrl}" alt="${trip.name}" onerror="this.src='https://images.unsplash.com/photo-1488085061387-422e29b40080?w=800'">
            <div class="trip-card-body">
              <h4>${trip.name}</h4>
              <div class="trip-meta">
                <span>📍 ${trip.destination}</span>
                <span>🗓 ${trip.durationDays} days</span>
                <span>👥 Max ${trip.maxCapacity}</span>
              </div>
              <p>${trip.description}</p>
              <div class="price">$${trip.price.toLocaleString()} per person</div>
              <a class="btn" href="trip.html?id=${trip.id}">View Itinerary</a>
            </div>
          </div>
        `;
      });
    } catch (err) {
      document.getElementById('tripsGrid').innerHTML =
        '<div class="loading">Could not load trips. Make sure the backend is running.</div>';
    }
  }

  loadTrips();
</script>

</body>
</html>
