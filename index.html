<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserve Journeys</title>
  <style>
    :root {
      --bg: #e8e2d8;
      --surface: #f4efe6;
      --surface-alt: #f7f1e7;
      --surface-dark: #1e3020;
      --text: #1e3020;
      --muted: #8a7a6a;
      --accent: #6e1e2e;
      --accent-soft: #c45a70;
      --shadow: rgba(30, 48, 32, 0.12);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      background: var(--surface-dark);
      color: #f4efe6;
      padding: 24px 40px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-mark {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      background: linear-gradient(135deg, #6e1e2e, #1e3020);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,0.15);
    }

    .brand-mark svg { width: 32px; height: 32px; }

    .brand-title h1 {
      font-size: 1.9rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .brand-title p {
      margin-top: 4px;
      font-size: 0.95rem;
      color: var(--muted);
    }

    .hero {
      background: linear-gradient(135deg, var(--surface-dark), var(--accent));
      color: white;
      text-align: center;
      padding: 95px 24px;
    }

    .hero h2 { font-size: 3rem; margin-bottom: 18px; letter-spacing: 0.04em; }
    .hero p { font-size: 1.2rem; color: rgba(255,255,255,0.86); max-width: 560px; margin: 0 auto; line-height: 1.6; }

    .trips-section {
      max-width: 1120px;
      margin: 40px auto 60px;
      padding: 0 20px;
    }

    .trips-section h3 {
      font-size: 1.7rem;
      margin-bottom: 28px;
      color: var(--surface-dark);
    }

    .trips-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 28px;
    }

    .trip-card {
      background: var(--surface);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 18px 60px var(--shadow);
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .trip-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 22px 64px rgba(30,48,32,0.18);
    }

    .trip-card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }

    .trip-card-body { padding: 24px; }

    .trip-card-body h4 {
      font-size: 1.3rem;
      margin-bottom: 10px;
      color: var(--surface-dark);
    }

    .trip-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 14px 0;
      font-size: 0.95rem;
      color: var(--muted);
    }

    .trip-card-body p {
      font-size: 0.95rem;
      color: #5a5a50;
      line-height: 1.7;
      margin-bottom: 18px;
    }

    .btn {
      display: inline-block;
      background: var(--accent);
      color: white;
      padding: 12px 26px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 0.95rem;
      transition: background 0.2s ease;
    }

    .btn:hover { background: var(--accent-soft); }

    .price {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--accent-soft);
      margin-bottom: 10px;
    }

    .loading {
      text-align: center;
      padding: 60px;
      color: var(--muted);
      font-size: 1.05rem;
    }

    footer {
      background: var(--surface-dark);
      color: #cfc5b0;
      text-align: center;
      padding: 28px 20px;
      margin-top: 40px;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 108 108" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="54" cy="54" r="50" stroke="rgba(255,255,255,0.8)" stroke-width="1.2"/>
        <path d="M 10 82 Q 34 76 54 78" stroke="rgba(255,255,255,0.85)" stroke-width="1.3" fill="none" stroke-linecap="round"/>
        <path d="M 72 18 L 86 24 L 72 31" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="1.3" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="brand-title">
      <h1>Reserve Journeys</h1>
      <p>Curated travel experiences</p>
    </div>
  </div>
</header>

<div class="hero">
  <h2>Travel with a thoughtful, elevated experience.</h2>
  <p>Discover handcrafted journeys designed with premium service, refined style, and unforgettable destinations.</p>
</div>

<div class="trips-section">
  <h3>Available Trips</h3>
  <div class="trips-grid" id="tripsGrid">
    <div class="loading">Loading trips...</div>
  </div>
</div>

<footer>
  <p>© 2026 Reserve Journeys. All rights reserved.</p>
</footer>

<script>
  const API = 'https://golf-wine-website-production.up.railway.app';

  async function loadTrips() {
    try {
      const res = await fetch(`${API}/api/trips`);
      const trips = await res.json();
      const grid = document.getElementById('tripsGrid');
      grid.innerHTML = '';

      trips.forEach(trip => {
        grid.innerHTML += `
          <div class="trip-card" onclick="window.location.href='trip.html?id=${trip.id}'">
            <img src="${trip.imageUrl}" alt="${trip.name}" onerror="this.src='https://images.unsplash.com/photo-1488085061387-422e29b40080?w=800'">
            <div class="trip-card-body">
              <h4>${trip.name}</h4>
              <div class="trip-meta">
                <span>📍 ${trip.destination}</span>
                <span>🗓 ${trip.durationDays} days</span>
                <span>👥 Max ${trip.maxCapacity}</span>
              </div>
              <p>${trip.description}</p>
              <div class="price">$${trip.price.toLocaleString()} per person</div>
              <a class="btn" href="trip.html?id=${trip.id}">View Itinerary</a>
            </div>
          </div>
        `;
      });
    } catch (err) {
      document.getElementById('tripsGrid').innerHTML =
        '<div class="loading">Could not load trips. Make sure the backend is running.</div>';
    }
  }

  loadTrips();
</script>

</body>
</html>
