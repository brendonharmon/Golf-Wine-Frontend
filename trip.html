<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trip Details - Reserve Journeys</title>
  <style>
    :root {
      --bg: #e8e2d8;
      --surface: #f4efe6;
      --surface-dark: #1e3020;
      --text: #1e3020;
      --muted: #8a7a6a;
      --accent: #6e1e2e;
      --accent-soft: #c45a70;
      --shadow: rgba(30,48,32,0.12);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }

    header {
      background: var(--surface-dark);
      color: #f4efe6;
      padding: 24px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-mark {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent), var(--surface-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,0.15);
    }

    .brand-mark svg { width: 28px; height: 28px; }

    .brand-title h1 {
      font-size: 1.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .brand-title p {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 4px;
    }

    .hero-img {
      width: 100%;
      height: 380px;
      object-fit: cover;
      border-bottom: 12px solid var(--surface);
    }

    .content {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .trip-header {
      background: var(--surface);
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 18px 40px var(--shadow);
      margin-bottom: 30px;
    }

    .trip-header h2 { font-size: 2rem; color: var(--surface-dark); margin-bottom: 10px; }

    .trip-meta {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin: 15px 0;
      font-size: 0.95rem;
      color: #555;
    }

    .trip-meta span { display: flex; align-items: center; gap: 5px; }

    .price {
      font-size: 1.6rem;
      font-weight: bold;
      color: var(--accent-soft);
      margin-top: 10px;
    }

    .trip-header p { color: #5c5a52; line-height: 1.7; margin-top: 10px; }

    .section-title {
      font-size: 1.4rem;
      color: var(--surface-dark);
      margin-bottom: 20px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--accent-soft);
    }

    .itinerary { margin-bottom: 40px; }

    .day {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      background: var(--surface);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 16px 40px rgba(30,48,32,0.08);
    }

    .day-number {
      background: var(--accent);
      color: white;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    .day-content h4 { color: var(--surface-dark); margin-bottom: 5px; font-size: 1rem; }
    .day-content p { color: #5c5a52; font-size: 0.9rem; line-height: 1.6; }

    .booking-form {
      background: var(--surface);
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 18px 40px var(--shadow);
      margin-bottom: 40px;
    }

    .form-group { margin-bottom: 20px; }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: var(--surface-dark);
      font-size: 0.9rem;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
      transition: border-color 0.2s;
      background: #fff;
    }

    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

    .total-price {
      background: #fff4f5;
      border-radius: 12px;
      padding: 18px 22px;
      margin-bottom: 20px;
      font-size: 1.1rem;
      color: var(--surface-dark);
    }

    .total-price span { font-weight: bold; color: var(--accent-soft); font-size: 1.3rem; }

    .btn {
      background: var(--accent-soft);
      color: white;
      border: none;
      padding: 14px 30px;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }

    .btn:hover { background: #b04161; }
    .btn:disabled { background: #aaa; cursor: not-allowed; }

    .error {
      background: #fff0f0;
      border: 1px solid #ffcccc;
      color: #cc0000;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: none;
    }

    footer {
      background: var(--surface-dark);
      color: #cfc5b0;
      text-align: center;
      padding: 30px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 108 108" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="54" cy="54" r="50" stroke="rgba(255,255,255,0.8)" stroke-width="1.2"/>
        <path d="M 10 82 Q 34 76 54 78" stroke="rgba(255,255,255,0.85)" stroke-width="1.3" fill="none" stroke-linecap="round"/>
        <path d="M 72 18 L 86 24 L 72 31" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="1.3" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="brand-title">
      <h1>Reserve Journeys</h1>
      <p>Curated travel experiences</p>
    </div>
  </div>
  <a href="index.html">← Back to All Trips</a>
</header>

<img class="hero-img" id="heroImg" src="" alt="Trip Image">

<div class="content">

  <div class="trip-header" id="tripHeader">
    <div class="loading">Loading trip...</div>
  </div>

  <div class="itinerary">
    <h3 class="section-title">Day-by-Day Itinerary</h3>
    <div id="itineraryList"></div>
  </div>

  <div class="booking-form">
    <h3 class="section-title">Book This Trip</h3>
    <div class="error" id="errorMsg"></div>

    <div class="form-row">
      <div class="form-group">
        <label>First & Last Name</label>
        <input type="text" id="customerName" placeholder="Jane Smith">
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="customerEmail" placeholder="jane@email.com">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" id="customerPhone" placeholder="555-123-4567">
      </div>
      <div class="form-group">
        <label>Number of Travelers</label>
        <select id="numTravelers" onchange="updateTotal()">
          <option value="1">1 Traveler</option>
          <option value="2">2 Travelers</option>
          <option value="3">3 Travelers</option>
          <option value="4">4 Travelers</option>
          <option value="5">5 Travelers</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>Travel Date</label>
      <input type="date" id="travelDate">
    </div>

    <div class="total-price">
      Estimated Total: <span id="totalPrice">$0</span>
    </div>

    <button class="btn" id="bookBtn" onclick="submitBooking()">Confirm Booking</button>
  </div>

</div>

<footer>
  <p>© 2026 Reserve Journeys. All rights reserved.</p>
</footer>

<script>
  const API = 'https://golf-wine-website-production.up.railway.app';
  let currentTrip = null;

  function getTripIdFromUrl() {
    const params = new URLSearchParams(window.location.search);
    return params.get('id');
  }

  async function loadTrip() {
    const id = getTripIdFromUrl();
    if (!id) { window.location.href = 'index.html'; return; }

    try {
      const res = await fetch(`${API}/api/trips/${id}`);
      const trip = await res.json();
      currentTrip = trip;

      document.title = `${trip.name} - Wanderlust Travel`;
      document.getElementById('heroImg').src = trip.imageUrl;

      document.getElementById('tripHeader').innerHTML = `
        <h2>${trip.name}</h2>
        <div class="trip-meta">
          <span>📍 ${trip.destination}</span>
          <span>🗓 ${trip.durationDays} days</span>
          <span>👥 Max ${trip.maxCapacity} travelers</span>
        </div>
        <p>${trip.description}</p>
        <div class="price">$${trip.price.toLocaleString()} per person</div>
      `;

      const sorted = trip.itineraryDays.sort((a, b) => a.dayNumber - b.dayNumber);
      const list = document.getElementById('itineraryList');
      list.innerHTML = '';
      sorted.forEach(day => {
        list.innerHTML += `
          <div class="day">
            <div class="day-number">Day ${day.dayNumber}</div>
            <div class="day-content">
              <h4>${day.title}</h4>
              <p>${day.description}</p>
            </div>
          </div>
        `;
      });

      // Set min date to tomorrow
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      document.getElementById('travelDate').min = tomorrow.toISOString().split('T')[0];

      updateTotal();
    } catch (err) {
      document.getElementById('tripHeader').innerHTML = '<p>Could not load trip details.</p>';
    }
  }

  function updateTotal() {
    if (!currentTrip) return;
    const num = parseInt(document.getElementById('numTravelers').value);
    const total = (currentTrip.price * num).toLocaleString();
    document.getElementById('totalPrice').textContent = `$${total}`;
  }

  async function submitBooking() {
    const name = document.getElementById('customerName').value.trim();
    const email = document.getElementById('customerEmail').value.trim();
    const phone = document.getElementById('customerPhone').value.trim();
    const travelDate = document.getElementById('travelDate').value;
    const numTravelers = document.getElementById('numTravelers').value;
    const errorMsg = document.getElementById('errorMsg');

    errorMsg.style.display = 'none';

    if (!name || !email || !phone || !travelDate) {
      errorMsg.textContent = 'Please fill in all fields before booking.';
      errorMsg.style.display = 'block';
      return;
    }

    const btn = document.getElementById('bookBtn');
    btn.disabled = true;
    btn.textContent = 'Processing...';

    try {
      const res = await fetch(`${API}/api/bookings`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          tripId: currentTrip.id,
          customerName: name,
          customerEmail: email,
          customerPhone: phone,
          travelDate: travelDate,
          numTravelers: parseInt(numTravelers)
        })
      });

      const booking = await res.json();
      window.location.href = `booking.html?id=${booking.id}`;
    } catch (err) {
      errorMsg.textContent = 'Something went wrong. Please try again.';
      errorMsg.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Confirm Booking';
    }
  }

  loadTrip();
</script>

</body>
</html>
