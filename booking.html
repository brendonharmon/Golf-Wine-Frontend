<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking Confirmed - Reserve Journeys</title>
  <style>
    :root {
      --bg: #e8e2d8;
      --surface: #f4efe6;
      --surface-dark: #1e3020;
      --text: #1e3020;
      --muted: #8a7a6a;
      --accent: #6e1e2e;
      --accent-soft: #c45a70;
      --shadow: rgba(30,48,32,0.12);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }

    header {
      background: var(--surface-dark);
      color: #f4efe6;
      padding: 24px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-mark {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent), var(--surface-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,0.15);
    }

    .brand-mark svg { width: 28px; height: 28px; }

    .brand-title h1 {
      font-size: 1.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .brand-title p {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 4px;
    }

    .content {
      max-width: 840px;
      margin: 50px auto;
      padding: 0 20px;
    }

    .confirmed-banner {
      background: linear-gradient(135deg, var(--surface-dark), var(--accent));
      color: white;
      border-radius: 18px;
      padding: 42px;
      text-align: center;
      margin-bottom: 28px;
      box-shadow: 0 24px 60px var(--shadow);
    }

    .confirmed-banner .checkmark {
      font-size: 3.8rem;
      margin-bottom: 15px;
    }

    .confirmed-banner h2 { font-size: 2rem; margin-bottom: 10px; }
    .confirmed-banner p { color: rgba(255,255,255,0.8); font-size: 1rem; }

    .booking-card {
      background: var(--surface);
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 18px 40px var(--shadow);
      margin-bottom: 30px;
      border: 1px solid rgba(30, 48, 32, 0.08);
    }

    .section-title {
      font-size: 1.25rem;
      color: var(--surface-dark);
      margin-bottom: 18px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--accent-soft);
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid #efe6dc;
      font-size: 0.95rem;
    }

    .detail-row:last-child { border-bottom: none; }
    .detail-row .label { color: var(--muted); }
    .detail-row .value { font-weight: 600; color: var(--surface-dark); }

    .total-row .value { color: var(--accent-soft); font-size: 1.2rem; }

    .status-badge {
      display: inline-block;
      background: #f6ebef;
      color: var(--accent);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .itinerary { margin-bottom: 30px; }

    .day {
      display: flex;
      gap: 20px;
      margin-bottom: 15px;
      background: var(--surface);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 14px 40px rgba(30,48,32,0.08);
    }

    .day-number {
      background: var(--accent);
      color: white;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .day-content h4 { color: var(--surface-dark); margin-bottom: 4px; font-size: 0.95rem; }
    .day-content p { color: #5c5a52; font-size: 0.88rem; line-height: 1.6; }

    .actions {
      display: flex;
      gap: 15px;
      margin-bottom: 50px;
      flex-wrap: wrap;
    }

    .btn {
      flex: 1;
      text-align: center;
      padding: 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      text-decoration: none;
      transition: background 0.2s;
    }

    .btn-primary { background: var(--accent-soft); color: white; }
    .btn-primary:hover { background: #b04161; }
    .btn-secondary { background: var(--surface-dark); color: white; }
    .btn-secondary:hover { background: #162619; }

    footer {
      background: var(--surface-dark);
      color: #cfc5b0;
      text-align: center;
      padding: 30px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 108 108" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="54" cy="54" r="50" stroke="rgba(255,255,255,0.8)" stroke-width="1.2"/>
        <path d="M 10 82 Q 34 76 54 78" stroke="rgba(255,255,255,0.85)" stroke-width="1.3" fill="none" stroke-linecap="round"/>
        <path d="M 72 18 L 86 24 L 72 31" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="1.3" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="brand-title">
      <h1>Reserve Journeys</h1>
      <p>Curated travel experiences</p>
    </div>
  </div>
  <a href="index.html">← Back to All Trips</a>
</header>

<div class="content">

  <div class="confirmed-banner">
    <div class="checkmark">✅</div>
    <h2>Booking Confirmed!</h2>
    <p>Your adventure is officially on the books. See you out there!</p>
  </div>

  <div class="booking-card" id="bookingDetails">
    <div class="loading">Loading booking details...</div>
  </div>

  <div class="itinerary">
    <h3 class="section-title">Your Trip Itinerary</h3>
    <div id="itineraryList"></div>
  </div>

  <div class="actions">
    <a href="index.html" class="btn btn-secondary">Browse More Trips</a>
    <a href="#" class="btn btn-primary" onclick="window.print()">🖨 Print Itinerary</a>
  </div>

</div>

<footer>
  <p>© 2026 Reserve Journeys. All rights reserved.</p>
</footer>

<script>
  const API = 'https://golf-wine-website-production.up.railway.app';

  function getBookingIdFromUrl() {
    const params = new URLSearchParams(window.location.search);
    return params.get('id');
  }

  async function loadBooking() {
    const id = getBookingIdFromUrl();
    if (!id) { window.location.href = 'index.html'; return; }

    try {
      const res = await fetch(`${API}/api/bookings/${id}`);
      const booking = await res.json();
      const trip = booking.trip;
      const customer = booking.customer;

      document.title = `Booking #${booking.id} - Wanderlust Travel`;

      document.getElementById('bookingDetails').innerHTML = `
        <h3 class="section-title">Booking Summary</h3>
        <div class="detail-row">
          <span class="label">Booking ID</span>
          <span class="value">#${booking.id}</span>
        </div>
        <div class="detail-row">
          <span class="label">Status</span>
          <span class="value"><span class="status-badge">${booking.status}</span></span>
        </div>
        <div class="detail-row">
          <span class="label">Trip</span>
          <span class="value">${trip.name}</span>
        </div>
        <div class="detail-row">
          <span class="label">Destination</span>
          <span class="value">📍 ${trip.destination}</span>
        </div>
        <div class="detail-row">
          <span class="label">Duration</span>
          <span class="value">${trip.durationDays} days</span>
        </div>
        <div class="detail-row">
          <span class="label">Travel Date</span>
          <span class="value">🗓 ${formatDate(booking.travelDate)}</span>
        </div>
        <div class="detail-row">
          <span class="label">Travelers</span>
          <span class="value">👥 ${booking.numTravelers}</span>
        </div>
        <div class="detail-row">
          <span class="label">Guest Name</span>
          <span class="value">${customer.name}</span>
        </div>
        <div class="detail-row">
          <span class="label">Email</span>
          <span class="value">${customer.email}</span>
        </div>
        <div class="detail-row">
          <span class="label">Phone</span>
          <span class="value">${customer.phone}</span>
        </div>
        <div class="detail-row total-row">
          <span class="label">Total Price</span>
          <span class="value">$${booking.totalPrice.toLocaleString()}</span>
        </div>
      `;

      const sorted = trip.itineraryDays.sort((a, b) => a.dayNumber - b.dayNumber);
      const list = document.getElementById('itineraryList');
      list.innerHTML = '';
      sorted.forEach(day => {
        list.innerHTML += `
          <div class="day">
            <div class="day-number">Day ${day.dayNumber}</div>
            <div class="day-content">
              <h4>${day.title}</h4>
              <p>${day.description}</p>
            </div>
          </div>
        `;
      });

    } catch (err) {
      document.getElementById('bookingDetails').innerHTML =
        '<p style="color:#cc0000">Could not load booking. Please check your booking ID.</p>';
    }
  }

  function formatDate(dateArr) {
    if (!dateArr) return 'N/A';
    // Spring returns dates as [year, month, day] arrays
    if (Array.isArray(dateArr)) {
      const [year, month, day] = dateArr;
      return new Date(year, month - 1, day).toLocaleDateString('en-US', {
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
      });
    }
    return new Date(dateArr).toLocaleDateString('en-US', {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });
  }

  loadBooking();
</script>

</body>
</html>
